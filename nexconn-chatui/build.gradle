apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.dokka'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "ai.nexconn.chatui"
    compileSdk NEXCONN_COMPILE_SDK.toInteger()

    defaultConfig {
        minSdkVersion NEXCONN_MIN_SDK.toInteger()
        targetSdkVersion NEXCONN_TARGET_SDK.toInteger()
        consumerProguardFiles "consumer-rules.pro"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // BuildConfig generation is disabled by default in newer AGP versions.
        android.buildFeatures.buildConfig true

        buildConfigField "String", "VERSION_NAME", "${UNIVERSAL_NEXCONN_VERSION}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            res.srcDirs += "src/main/res-lively"
            res.srcDirs += "src/main/res-lively-light"
            res.srcDirs += "src/main/res-lively-dark"
        }
    }

    packagingOptions {
        doNotStrip "*/armeabi/*.so"
        doNotStrip "*/armeabi-v7a/*.so"
        doNotStrip "*/arm64-v8a/*.so"
        doNotStrip "*/x86/*.so"
        doNotStrip "*/x86_64/*.so"
        doNotStrip "*/mips/*.so"
        doNotStrip "*/mips64/*.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lintOptions {
        abortOnError false
        baseline file("lint-baseline.xml")
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    api "ai.nexconn.chat:chat:${NEXCONN_CHAT_SDK_VERSION}"
    // Core UI dependencies
    api 'androidx.appcompat:appcompat:1.2.0'
    api 'androidx.fragment:fragment:1.2.5'
    api 'androidx.recyclerview:recyclerview:1.1.0'
    api 'androidx.constraintlayout:constraintlayout:2.0.4'
    api 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    api "androidx.viewpager2:viewpager2:1.0.0"
    // Content URI handling
    api "androidx.documentfile:documentfile:1.0.1"
    // Local broadcasts
    api 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    // Data storage
    api "androidx.room:room-runtime:2.4.0"
    api "androidx.annotation:annotation:1.2.0"
    api "androidx.lifecycle:lifecycle-runtime:2.4.0"
    annotationProcessor "androidx.room:room-compiler:2.4.0"
    // Image loading
    api 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    // Emoji support merged from the former :emoji module
    implementation "androidx.emoji2:emoji2-bundled:1.3.0"
    implementation "androidx.emoji2:emoji2:1.3.0"
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ["-parameters"]
}

ext.NEXCONN_POM_LICENSE_NAME = 'Apache License 2.0'
ext.NEXCONN_POM_LICENSE_URL = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
ext.NEXCONN_POM_SCM_URL = 'https://github.com/NexconnAI-Dev/nexconn-chatui-android'
ext.NEXCONN_POM_DESCRIPTION = 'Nexconn ChatUI for Android'
ext.NEXCONN_PUBLISH_SOURCES = true

def nexconnPublishingScript = rootProject.file('upload-maven-nexconn.gradle')
if (nexconnPublishingScript.exists()) {
    apply from: nexconnPublishingScript
}

task makeJar(type: Jar) {
    delete 'build/libs'
    archiveBaseName.set('nexconn_chatui_' + UNIVERSAL_NEXCONN_VERSION.substring(1, UNIVERSAL_NEXCONN_VERSION.length() - 1))
    from zipTree(file('build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar'))
    destinationDirectory.set(file('build/libs/'))
    exclude('**/BuildConfig.class')
    exclude('**/R.class')
}
makeJar.dependsOn(build)


// -------- Dokka configuration START --------------
import org.jetbrains.dokka.gradle.DokkaTaskPartial
import org.jetbrains.dokka.DokkaConfiguration.Visibility

tasks.dokkaJavadoc.configure {
    dokkaSourceSets {
        configureEach {
            // Include public and protected APIs.
            documentedVisibilities.set([
                    Visibility.PUBLIC,
                    Visibility.PROTECTED
            ])
        }
    }
}

tasks.register('dokkaJavadocJar', Jar.class) {
    dependsOn(dokkaJavadoc)
    from(dokkaJavadoc)
    archiveClassifier.set("javadoc")
}

// -------- Dokka configuration END --------------
